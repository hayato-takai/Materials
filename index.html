<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolidWorks Material Browser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  background: #f0f0f0;
  color: #1a1a1a;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: #0078d4;
  color: #fff;
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  flex-shrink: 0;
  user-select: none;
}

#app {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */
#sidebar {
  width: 265px;
  min-width: 200px;
  background: #fff;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  padding: 12px 10px;
  gap: 5px;
  flex-shrink: 0;
  overflow: hidden;
}

.lbl {
  font-weight: 600;
  font-size: 11px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 6px;
  flex-shrink: 0;
}

select, input[type=text] {
  width: 100%;
  padding: 5px 8px;
  border: 1px solid #ccc;
  border-radius: 3px;
  font-family: inherit;
  font-size: 13px;
  background: #fafafa;
  flex-shrink: 0;
}

select:focus, input:focus {
  outline: none;
  border-color: #0078d4;
  box-shadow: 0 0 0 2px rgba(0,120,212,0.15);
}

#mat-list {
  flex: 1;
  overflow-y: auto;
  border: 1px solid #ccc;
  border-radius: 3px;
  background: #fff;
  min-height: 0;
}

.mat-item {
  padding: 5px 10px;
  cursor: pointer;
  font-size: 13px;
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mat-item:hover                   { background: #e8f0fe; }
.mat-item.selected                { background: #0078d4; color: #fff; }
.mat-item.retained                { background: #e0e0e0; color: #444; }
.mat-item.selected.retained       { background: #0078d4; color: #fff; }

/* ── Main panel ──────────────────────────────────────────────────────── */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 18px;
  gap: 10px;
  overflow: hidden;
  min-height: 0;
}

#top-row {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#mat-name {
  font-size: 17px;
  font-weight: 700;
  color: #111;
}

.section-box {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  overflow: hidden;
}

.section-title {
  padding: 6px 12px;
  background: #f3f3f3;
  border-bottom: 1px solid #ddd;
  font-size: 11px;
  font-weight: 700;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  user-select: none;
}

/* Properties table */
#props-scroll { max-height: 185px; overflow-y: auto; }

#props-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

#props-table thead th {
  position: sticky;
  top: 0;
  background: #e8e8e8;
  font-weight: 600;
  padding: 5px 12px;
  text-align: left;
  border-bottom: 1px solid #ccc;
  z-index: 1;
}

#props-table thead th:nth-child(2) { text-align: right; }

#props-table tbody td {
  padding: 4px 12px;
  border-bottom: 1px solid #f0f0f0;
}

#props-table tbody td:nth-child(2) {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-family: 'Consolas', monospace;
  font-size: 12px;
}

#props-table tbody tr:nth-child(even) td { background: #f5f8ff; }

/* Curve info */
#curve-info { font-size: 12px; color: #666; }

/* Buttons */
#btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  padding: 6px 14px;
  border: 1px solid #0078d4;
  border-radius: 3px;
  background: #fff;
  color: #0078d4;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}

.btn:hover:not(:disabled) { background: #0078d4; color: #fff; }
.btn:disabled { border-color: #bbb; color: #bbb; cursor: default; background: #fff; }
.btn.danger { border-color: #c50000; color: #c50000; }
.btn.danger:hover:not(:disabled) { background: #c50000; color: #fff; }

/* ── Side-by-side charts ─────────────────────────────────────────────── */
#charts-row {
  flex: 1;
  min-height: 0;
  display: flex;
  gap: 12px;
}

.chart-box {
  flex: 1;
  min-width: 0;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chart-header {
  padding: 7px 12px;
  background: #f3f3f3;
  border-bottom: 1px solid #ddd;
  font-size: 11px;
  font-weight: 700;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  user-select: none;
  flex-shrink: 0;
}

.chart-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
  padding: 8px;
}
</style>
</head>
<body>
<header>SolidWorks Material Browser</header>
<div id="app">

  <div id="sidebar">
    <div class="lbl">Classification</div>
    <select id="cls-select"></select>
    <div class="lbl">Search</div>
    <input id="search-input" type="text" placeholder="Filter materials&#8230;" autocomplete="off">
    <div class="lbl">Materials</div>
    <div id="mat-list"></div>
  </div>

  <div id="main">
    <div id="top-row">
      <div id="mat-name">Select a material</div>

      <div class="section-box">
        <div class="section-title">Properties</div>
        <div id="props-scroll">
          <table id="props-table">
            <thead><tr><th>Property</th><th>Value</th><th>Unit</th></tr></thead>
            <tbody id="props-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="curve-info"></div>

      <div id="btn-row">
        <button class="btn" id="btn-retain" disabled>Retain for Comparison</button>
        <button class="btn danger" id="btn-clear">Clear All</button>
        <button class="btn" id="btn-copy" disabled style="margin-left:auto">Copy SN Curve as Table</button>
      </div>
    </div>

    <div id="charts-row">
      <div class="chart-box">
        <div class="chart-header">Stress-Strain</div>
        <div class="chart-wrap"><canvas id="ss-canvas"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-header">SN Curve</div>
        <div class="chart-wrap"><canvas id="sn-canvas"></canvas></div>
      </div>
    </div>
  </div>

</div>

// ── Helpers ───────────────────────────────────────────────────────────────────
function getColor(name) {
  if (!state.colorMap.has(name)) {
    state.colorMap.set(name, PALETTE[state.colorIdx % PALETTE.length]);
    state.colorIdx++;
  }
  return state.colorMap.get(name);
}

function makeDataset(name, color, points, pointStyle) {
  return {
    label:           name,
    data:            points.map(p => ({ x: p[0], y: p[1] })),
    borderColor:     color,
    backgroundColor: color + '22',
    borderWidth:     2,
    pointRadius:     4,
    pointStyle:      pointStyle || 'circle',
    tension:         0.1
  };
}

function makeYieldDataset(name, color, ssPoints) {
  const yp = ssPoints[0];
  return {
    label:                name + ' (Yield)',
    data:                 [{ x: 0, y: 0 }, { x: yp[0], y: yp[1] }],
    borderColor:          color,
    backgroundColor:      color,
    borderWidth:          1.5,
    pointRadius:          [0, 6],
    pointHoverRadius:     [0, 8],
    pointBackgroundColor: [color, color],
    pointBorderColor:     [color, color],
    showLine:             true,
    tension:              0
  };
}

function rebuildCharts() {
  ssChart.data.datasets = [];
  snChart.data.datasets = [];

  // Retained materials first
  state.retained.forEach(({ mat, color }, name) => {
    if (mat.c.ss) {
      ssChart.data.datasets.push(makeYieldDataset(name, color, mat.c.ss));
      ssChart.data.datasets.push(makeDataset(name, color, mat.c.ss, 'circle'));
    }
    if (mat.c.sn) snChart.data.datasets.push(makeDataset(name, color, mat.c.sn, 'rect'));
  });

  // Current material (if not already retained)
  if (state.currentName && !state.retained.has(state.currentName)) {
    const mat   = state.currentMat;
    const color = getColor(state.currentName);
    if (mat.c.ss) {
      ssChart.data.datasets.push(makeYieldDataset(state.currentName, color, mat.c.ss));
      ssChart.data.datasets.push(makeDataset(state.currentName, color, mat.c.ss, 'circle'));
    }
    if (mat.c.sn) snChart.data.datasets.push(makeDataset(state.currentName, color, mat.c.sn, 'rect'));
  }

  ssChart.update();
  snChart.update();
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Classification ────────────────────────────────────────────────────────────
const clsSelect   = document.getElementById('cls-select');
const searchInput = document.getElementById('search-input');
const matListEl   = document.getElementById('mat-list');

DB.cls.forEach(cls => {
  const opt = document.createElement('option');
  opt.value = cls; opt.textContent = cls;
  clsSelect.appendChild(opt);
});

if (DB.cls.length) { state.cls = DB.cls[0]; renderMaterialList(); }

clsSelect.addEventListener('change', () => {
  state.cls = clsSelect.value;
  searchInput.value = '';
  state.currentName = null;
  state.currentMat  = null;
  state.retained.clear();
  state.colorMap.clear();
  state.colorIdx = 0;
  rebuildCharts();
  renderMaterialList();
  clearDetail();
});

searchInput.addEventListener('input', renderMaterialList);

// ── Material list ─────────────────────────────────────────────────────────────
function renderMaterialList() {
  const q    = searchInput.value.toLowerCase();
  const mats = DB.mat[state.cls] || {};
  matListEl.innerHTML = '';
  Object.keys(mats).sort().forEach(name => {
    if (q && !name.toLowerCase().includes(q)) return;
    const div        = document.createElement('div');
    const isCurrent  = name === state.currentName;
    const isRetained = state.retained.has(name);
    div.className = 'mat-item' + (isCurrent ? ' selected' : isRetained ? ' retained' : '');
    div.textContent = name;
    div.title = name;
    div.addEventListener('click', () => selectMaterial(name));
    matListEl.appendChild(div);
  });
}

// ── Material selection ────────────────────────────────────────────────────────
function selectMaterial(name) {
  state.currentName = name;
  state.currentMat  = DB.mat[state.cls][name];
  rebuildCharts();
  renderDetail();
  renderMaterialList();
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function clearDetail() {
  document.getElementById('mat-name').textContent    = 'Select a material';
  document.getElementById('props-tbody').innerHTML   = '';
  document.getElementById('curve-info').textContent  = '';
  const btnR = document.getElementById('btn-retain');
  btnR.disabled    = true;
  btnR.textContent = 'Retain for Comparison';
  document.getElementById('btn-copy').disabled = true;
}

function renderDetail() {
  const name = state.currentName;
  const mat  = state.currentMat;

  document.getElementById('mat-name').textContent = name;

  const tbody = document.getElementById('props-tbody');
  tbody.innerHTML = '';
  (mat.p || []).forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${escHtml(row.n)}</td><td>${escHtml(row.v)}</td><td>${escHtml(row.u)}</td>`;
    tbody.appendChild(tr);
  });
  if (!mat.p.length) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:#999;padding:8px 12px">No properties available</td></tr>';
  }

  const parts = [];
  if (mat.c.ss) parts.push('Stress-Strain data available');
  if (mat.c.sn) parts.push('SN curve data available');
  if (!parts.length) parts.push('No curve data available for this material');
  document.getElementById('curve-info').textContent = parts.join('  |  ');

  const already   = state.retained.has(name);
  const btnRetain = document.getElementById('btn-retain');
  btnRetain.disabled    = already;
  btnRetain.textContent = already ? 'Retained' : 'Retain for Comparison';

  document.getElementById('btn-copy').disabled = !mat.c.sn;
}

// ── Retain for Comparison ─────────────────────────────────────────────────────
document.getElementById('btn-retain').addEventListener('click', () => {
  if (!state.currentName || state.retained.has(state.currentName)) return;
  const color = getColor(state.currentName);
  state.retained.set(state.currentName, { mat: state.currentMat, color });
  renderDetail();
  renderMaterialList();
  // No chart rebuild needed — current is already displayed
});

// ── Clear All ─────────────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  state.retained.clear();
  state.colorMap.clear();
  state.colorIdx = 0;
  rebuildCharts();
  renderMaterialList();
  if (state.currentName) renderDetail();
});

// ── Copy SN table ─────────────────────────────────────────────────────────────
document.getElementById('btn-copy').addEventListener('click', () => {
  if (!state.currentMat || !state.currentMat.c.sn) return;
  const pts  = state.currentMat.c.sn;
  const rows = [];
  pts.forEach(p => rows.push(`${+p[0].toPrecision(6)}\t${+p[1].toPrecision(6)}`));
  navigator.clipboard.writeText(rows.join('\n')).then(() => {
    const btn  = document.getElementById('btn-copy');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }).catch(() => alert('Clipboard write failed. Try a browser other than file://.'));
});
</script>
